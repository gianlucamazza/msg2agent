version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      opentelemetry:
        applies-to: security-updates
        patterns:
          - "go.opentelemetry.io/otel*"
      minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Security updates only (limit 0 disables version updates): keep astro and @astrojs/* in lockstep
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      astro:
        applies-to: security-updates
        patterns:
          - "astro"
          - "@astrojs/*"
